services:
  mongodb:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: vella_fleet
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  vella:
    build:
      context: ./vella
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/vella_fleet
    depends_on:
      - mongodb

  vera-app:
    build:
      context: ./vera app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      VELLA_API_URL: http://vella:8000
    depends_on:
      - vella

  vera:
    build:
      context: .
      dockerfile: vera/Dockerfile
    restart: always
    ports:
      - "8765:8765"
    environment:
      VERA_HOST: 0.0.0.0
      VERA_PORT: 8765
      VERA_DRONE_ID: VERA_001
      VERA_DRONE_NAME: VERA-001
      VELLA_BASE_URL: http://vella:8000
      VERA_CONNECTION_STRING: udp:127.0.0.1:14551
      VERA_HOME_POSITION: 6.642361,3.320583,20
    depends_on:
      - vella

volumes:
  mongo_data:

