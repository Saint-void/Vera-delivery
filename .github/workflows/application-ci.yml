name: Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  vella-test:
    name: Vella Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vella

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Vella tests
        run: ./mvnw test

  vera-test:
    name: Vera Companion Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vera

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python compilation
        run: python -m compileall .

  vera-app-build:
    name: Vera Dashboard Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vera app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: 'vera app/pnpm-lock.yaml'

      - name: Check versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build
