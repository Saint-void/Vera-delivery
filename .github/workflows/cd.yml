name: CD - Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vella
            image_name: vella
            context: ./vella
            dockerfile: ./vella/Dockerfile
          - name: vera-companion
            image_name: vera
            context: .
            dockerfile: ./vera/Dockerfile
          - name: vera-app
            image_name: vera-app
            context: ./vera app
            dockerfile: ./vera app/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.image_name }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.environment || 'prod' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Check KUBECONFIG secret availability
        id: check-kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          else
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "::warning::KUBECONFIG secret not found. Add your cluster kubeconfig to GitHub Secrets as 'KUBECONFIG' to enable automated deployments."
          fi

      - name: Configure Kubeconfig
        if: steps.check-kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes Cluster
        if: steps.check-kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          echo "Deploying ${{ env.TARGET_ENV }} environment to Kubernetes..."
          kubectl apply -k ./k8s/overlays/${{ env.TARGET_ENV }}

          echo "Updating deployment images to commit SHA: ${{ github.sha }}"
          kubectl set image deployment/${{ env.TARGET_ENV }}-vella vella=ghcr.io/${{ env.REPO_LOWER }}/vella:${{ github.sha }} -n vella-fleet
          kubectl set image deployment/${{ env.TARGET_ENV }}-vera-companion vera-companion=ghcr.io/${{ env.REPO_LOWER }}/vera:${{ github.sha }} -n vella-fleet
          kubectl set image deployment/${{ env.TARGET_ENV }}-vera-app vera-app=ghcr.io/${{ env.REPO_LOWER }}/vera-app:${{ github.sha }} -n vella-fleet

      - name: Verify Rollout Status
        if: steps.check-kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          echo "Verifying deployment rollouts..."
          kubectl rollout status deployment/${{ env.TARGET_ENV }}-vella -n vella-fleet --timeout=180s
          kubectl rollout status deployment/${{ env.TARGET_ENV }}-vera-companion -n vella-fleet --timeout=180s
          kubectl rollout status deployment/${{ env.TARGET_ENV }}-vera-app -n vella-fleet --timeout=180s
          echo "Deployment successfully rolled out!"

