apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vella-hpa
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: vella
    app.kubernetes.io/component: fleet-backend
    app.kubernetes.io/part-of: vera-delivery-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vella
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
