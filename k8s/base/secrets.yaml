apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: fleet-secrets
    app.kubernetes.io/part-of: vera-delivery-system
type: Opaque
stringData:
  # Base default credentials (replace with external Vault / SealedSecrets in production)
  MONGO_INITDB_ROOT_USERNAME: "fleet_admin"
  MONGO_INITDB_ROOT_PASSWORD: "fleet_secure_password_k8s"
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb.vella-fleet.svc.cluster.local:27017/vella_fleet"
