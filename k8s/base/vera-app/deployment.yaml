apiVersion: apps/v1
kind: Deployment
metadata:
  name: vera-app
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: vera-app
    app.kubernetes.io/component: dashboard-frontend
    app.kubernetes.io/part-of: vera-delivery-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vera-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vera-app
        app.kubernetes.io/component: dashboard-frontend
        app.kubernetes.io/part-of: vera-delivery-system
    spec:
      containers:
        - name: vera-app
          image: ghcr.io/saint-void/vera-delivery/vera-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: VELLA_API_URL
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VELLA_API_URL
            - name: GEOCODER_USER_AGENT
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: GEOCODER_USER_AGENT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
