apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vera-app-hpa
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: vera-app
    app.kubernetes.io/component: dashboard-frontend
    app.kubernetes.io/part-of: vera-delivery-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vera-app
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
