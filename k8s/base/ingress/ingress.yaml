apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: fleet-ingress
    app.kubernetes.io/part-of: vera-delivery-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "vella"
spec:
  rules:
    - host: fleet.local
      http:
        paths:
          # Real-time WebSocket Telemetry Route
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: vella
                port:
                  number: 8000
          # SSE Real-time Fleet Updates Route
          - path: /fleet/
            pathType: Prefix
            backend:
              service:
                name: vella
                port:
                  number: 8000
          # Fleet Backend REST API Routes
          - path: /drones
            pathType: Prefix
            backend:
              service:
                name: vella
                port:
                  number: 8000
          - path: /missions
            pathType: Prefix
            backend:
              service:
                name: vella
                port:
                  number: 8000
          - path: /actuator/
            pathType: Prefix
            backend:
              service:
                name: vella
                port:
                  number: 8000
          # Frontend Web Dashboard Route (Catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vera-app
                port:
                  number: 3000
