apiVersion: apps/v1
kind: Deployment
metadata:
  name: vera-companion
  namespace: vella-fleet
  labels:
    app.kubernetes.io/name: vera-companion
    app.kubernetes.io/component: drone-companion
    app.kubernetes.io/part-of: vera-delivery-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vera-companion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vera-companion
        app.kubernetes.io/component: drone-companion
        app.kubernetes.io/part-of: vera-delivery-system
    spec:
      containers:
        - name: vera-companion
          image: ghcr.io/saint-void/vera-delivery/vera:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: VERA_HOST
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_HOST
            - name: VERA_PORT
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_PORT
            - name: VERA_DRONE_ID
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_DRONE_ID
            - name: VERA_DRONE_NAME
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_DRONE_NAME
            - name: VELLA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VELLA_BASE_URL
            - name: VERA_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_CONNECTION_STRING
            - name: VERA_HOME_POSITION
              valueFrom:
                configMapKeyRef:
                  name: fleet-config
                  key: VERA_HOME_POSITION
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
