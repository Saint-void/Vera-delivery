apiVersion: apps/v1
kind: Deployment
metadata:
  name: vella
  namespace: vella-fleet
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: vella
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vera-app
  namespace: vella-fleet
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: vera-app
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: vella-fleet
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - fleet.vera.aero
      secretName: fleet-tls-cert
  rules:
    - host: fleet.vera.aero
