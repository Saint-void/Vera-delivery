server.port=${PORT:8000}
spring.application.name=vella

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/vella_fleet}}
spring.data.mongodb.database=${MONGODB_DATABASE:${SPRING_DATA_MONGODB_DATABASE:vella_fleet}}
spring.data.mongodb.auto-index-creation=true

# Jackson JSON naming to preserve compatibility with Python Vera & Dashboard clients
spring.jackson.property-naming-strategy=SNAKE_CASE

# Virtual Threads (Java 21) for high concurrency SSE & WebSocket ingestion
spring.threads.virtual.enabled=true

# Vella Fleet Configuration
vella.mission.min-battery-pct=${VELLA_MISSION_MIN_BATTERY_PCT:40}
vella.telemetry.stale-timeout-seconds=${VELLA_TELEMETRY_STALE_TIMEOUT_SECONDS:5.0}

# Logging
logging.level.com.vera.vella=INFO
